<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gérer mon école</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        overflow: hidden; display: grid; place-items: center; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(120% 90% at 50% 0%, #6d55f0 0%, #4a33bf 45%, #1c1150 100%);
      }
      /* Soft colours drifting behind */
      .blob { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .55; animation: drift 14s ease-in-out infinite alternate; }
      .b1 { width: 420px; height: 420px; background: #2bb6c9; top: -120px; left: -100px; }
      .b2 { width: 380px; height: 380px; background: #f08a2c; bottom: -140px; right: -80px; animation-delay: -5s; opacity: .35; }
      .b3 { width: 300px; height: 300px; background: #b3a4fb; bottom: 10%; left: 12%; animation-delay: -9s; opacity: .4; }
      @keyframes drift { to { transform: translate(60px, 40px) scale(1.15); } }
      .dots { position: fixed; inset: 0; background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px); background-size: 26px 26px; -webkit-mask-image: radial-gradient(60% 60% at 50% 50%, #000, transparent); mask-image: radial-gradient(60% 60% at 50% 50%, #000, transparent); }

      .box { position: relative; text-align: center; padding: 24px; width: min(440px, 100%); }
      .stage { position: relative; width: 190px; height: 190px; margin: 0 auto; }
      /* The school things turning around the logo */
      .orbit { position: absolute; inset: 0; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,.22); animation: spin 18s linear infinite; }
      .orbit span {
        position: absolute; width: 38px; height: 38px; margin: -19px; border-radius: 12px; display: grid; place-items: center;
        box-shadow: 0 12px 24px -12px rgba(0,0,0,.5); animation: spin 18s linear infinite reverse;
      }
      .orbit span:nth-child(1) { top: 0; left: 50%; background: #fff3c2; }
      .orbit span:nth-child(2) { top: 50%; left: 100%; background: #d6f3e4; }
      .orbit span:nth-child(3) { top: 100%; left: 50%; background: #ffe1e4; }
      .orbit span:nth-child(4) { top: 50%; left: 0; background: #dbeaff; }
      .orbit svg { width: 20px; height: 20px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .logo {
        position: absolute; inset: 50px; border-radius: 50%; display: grid; place-items: center;
        box-shadow: 0 24px 50px -18px rgba(10, 4, 40, .7); animation: breathe 2.4s ease-in-out infinite;
      }
      .logo svg { width: 100%; height: 100%; }
      .ring { position: absolute; inset: 50px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); animation: ring 2.4s ease-out infinite; }
      @keyframes breathe { 50% { transform: scale(1.06); } }
      @keyframes ring { from { transform: scale(1); opacity: .8; } to { transform: scale(1.7); opacity: 0; } }

      h1 { margin: 30px 0 6px; font-size: 34px; letter-spacing: -0.03em; font-weight: 700; }
      .tip { margin: 0; height: 24px; color: rgba(255,255,255,.8); font-size: 16px; transition: opacity .4s; }
      .bar { margin: 26px auto 0; width: 220px; height: 6px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
      .bar span { display: block; height: 100%; width: 40%; border-radius: 99px; background: linear-gradient(90deg, #ffd23f, #fff); animation: slide 1.4s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }

      button {
        margin-top: 26px; min-height: 50px; padding: 0 30px; border: 0; border-radius: 999px; cursor: pointer;
        background: #fff; color: #4a33bf; font-family: inherit; font-size: 15px; font-weight: 700;
        box-shadow: 0 18px 40px -16px rgba(0,0,0,.5);
      }
      button:hover { background: #f3f0ff; }
      #offline p { margin: 0 auto; max-width: 340px; color: rgba(255,255,255,.8); line-height: 1.5; }
      [hidden] { display: none !important; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
    </style>
  </head>
  <body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="dots"></div>

    <div class="box">
      <div class="stage" aria-hidden="true">
        <div class="orbit">
          <!-- pencil, book, star, bell -->
          <span><svg viewBox="0 0 24 24" fill="none" stroke="#6b4f00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/></svg></span>
          <span><svg viewBox="0 0 24 24" fill="none" stroke="#145a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg></span>
          <span><svg viewBox="0 0 24 24" fill="#8c1d31"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg></span>
          <span><svg viewBox="0 0 24 24" fill="none" stroke="#183f7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></span>
        </div>
        <div class="ring"></div>
        <div class="logo">
          <svg viewBox="0 0 512 512" aria-hidden="true"><circle cx="256" cy="256" r="256" fill="#4B1685"/><path d="M258.619 129.922C238.645 129.922 221.667 137.287 207.686 152.018C193.954 166.748 187.087 184.975 187.087 206.696C187.087 229.666 193.704 248.392 206.937 262.873C220.169 277.104 237.272 284.22 258.244 284.22C274.473 284.22 287.706 280.849 297.943 274.108C308.179 267.367 315.42 257.38 319.664 244.147H246.26V188.72H387.45C387.95 191.716 388.324 195.336 388.574 199.581C389.073 203.825 389.323 207.82 389.323 211.565C389.323 252.262 377.339 284.594 353.37 308.563C329.401 332.282 296.694 344.141 255.248 344.141C214.801 344.141 181.47 331.283 155.254 305.567C129.038 279.851 115.931 247.143 115.931 207.445C115.931 167.997 129.538 135.29 156.752 109.324C184.216 83.1079 218.297 70 258.993 70C283.461 70 305.682 74.9935 325.656 84.9804C345.88 94.9673 361.484 108.575 372.47 125.802L324.533 165.126C316.044 153.141 306.307 144.278 295.321 138.535C284.585 132.793 272.351 129.922 258.619 129.922Z" fill="#fff"/><path d="M94.7182 341.024C102.993 333.652 115.677 334.384 123.048 342.658C190.602 418.483 308.611 423.706 390.483 344.657C398.455 336.96 411.159 337.183 418.856 345.155C426.553 353.128 426.33 365.831 418.358 373.528C321.183 467.353 176.794 463.315 93.0834 369.354C85.7118 361.079 86.4438 348.395 94.7182 341.024Z" fill="#F5A900"/></svg>
        </div>
      </div>

      <div id="loading">
        <h1>Gérer mon école</h1>
        <p class="tip" id="tip">Ouverture de votre établissement…</p>
        <div class="bar"><span></span></div>
      </div>

      <div id="offline" hidden>
        <h1>Pas de connexion internet</h1>
        <p>Gérer mon école a besoin d'internet pour retrouver votre établissement. Vérifiez votre connexion, puis réessayez.</p>
        <button id="retry" type="button">Réessayer</button>
      </div>
    </div>

    <script>
      // The address of the site: the same one as in src-tauri/src/main.rs.
      const SITE = 'https://www.gerermonecole.com';
      const loading = document.getElementById('loading');
      const offline = document.getElementById('offline');
      const tip = document.getElementById('tip');
      const TIPS = ['Ouverture de votre établissement…', 'Préparation de vos classes…', 'Mise à jour des notes…', 'Ouverture de la caisse…'];
      let n = 0;
      setInterval(() => {
        tip.style.opacity = 0;
        setTimeout(() => { n = (n + 1) % TIPS.length; tip.textContent = TIPS[n]; tip.style.opacity = 1; }, 400);
      }, 2200);

      async function open() {
        loading.hidden = false;
        offline.hidden = true;
        try {
          // The opening screen stays at least a moment, so that it is seen rather than flashing by.
          await Promise.all([
            fetch(SITE + '/bienvenue', { mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(15000) }),
            new Promise((done) => setTimeout(done, 1600)),
          ]);
          location.replace(SITE + '/login');
        } catch {
          loading.hidden = true;
          offline.hidden = false;
        }
      }
      document.getElementById('retry').addEventListener('click', open);
      window.addEventListener('online', open);
      open();
    </script>
  </body>
</html>
